[project]
name = "agent-mcp-showcase"
version = "0.1.0"
description = "A small provider-neutral Python agent with a synthetic email MCP backend"
requires-python = ">=3.12"
dependencies = ["jsonschema>=4,<5", "mcp>=2,<3"]

[project.optional-dependencies]
dev = ["pytest>=9,<10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_showcase"]

[tool.pytest.ini_options]
testpaths = ["tests"]
